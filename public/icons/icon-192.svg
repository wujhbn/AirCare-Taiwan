<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Gradient: Deep slate to rich navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Premium Sky and Eco Gradient -->
    <linearGradient id="ecoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="url(#ecoGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- The AirCare Ring -->
  <g filter="url(#softShadow)">
    <circle cx="96" cy="96" r="48" fill="none" stroke="url(#ecoGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="240" stroke-dashoffset="30" />
    <circle cx="96" cy="96" r="30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.15" />
    
    <!-- Flowing wind wave lines -->
    <path d="M72,90 C84,80 92,80 104,90 C116,100 124,100 136,90" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
    <path d="M64,106 C76,96 84,96 96,106 C108,116 116,116 128,106" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M80,74 C88,68 94,68 102,74 C110,80 116,80 124,74" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- Glowing pulse dot for live active measurement -->
  <circle cx="132" cy="74" r="5" fill="#34d399" />
  <circle cx="132" cy="74" r="9" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="5;11;5" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
