<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep slate to rich navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Premium Sky and Eco Gradient -->
    <linearGradient id="ecoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#ecoGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- The AirCare Ring -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="128" fill="none" stroke="url(#ecoGrad)" stroke-width="26" stroke-linecap="round" stroke-dasharray="640" stroke-dashoffset="80" />
    <circle cx="256" cy="256" r="80" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />
    
    <!-- Flowing wind wave lines -->
    <path d="M192,240 C224,213 245,213 277,240 C309,267 330,267 362,240" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M168,282 C200,255 221,255 253,282 C285,309 306,309 338,282" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M212,198 C233,182 249,182 270,198 C291,214 307,214 328,198" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" />
  </g>

  <!-- Glowing pulse dot for live active measurement -->
  <circle cx="352" cy="198" r="12" fill="#34d399" />
  <circle cx="352" cy="198" r="22" fill="none" stroke="#34d399" stroke-width="4" opacity="0.6">
    <animate attributeName="r" values="12;26;12" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
